version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: backend_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --maxmemory 800mb
      --maxmemory-policy allkeys-lru
      --appendonly no
    networks:
      - backend_network

  backend-app:
    build: .
    container_name: backend_app
    restart: unless-stopped
    ports:
      - "5002:8000"
    volumes:
      - ./app.json:/app/app.json:ro
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - backend_network
    depends_on:
      - redis

volumes:
  redis_data:

networks:
  backend_network: 