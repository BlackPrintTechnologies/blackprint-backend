# Redis Configuration for Blackprint Backend
# Optimized for EC2 with 4GB RAM

# Network
bind 0.0.0.0
protected-mode no
port 6379
timeout 300

# Memory Management (512MB max for Redis)
maxmemory 512mb
maxmemory-policy allkeys-lru

# Persistence
save 900 1
save 300 10
save 60 10000
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Logging
loglevel notice
logfile ""

# Performance
tcp-keepalive 60
tcp-backlog 511

# Security (basic)
protected-mode no

# Client settings
maxclients 10000

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128 